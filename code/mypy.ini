# Static type check of the engine, the entry point, the evaluation scripts and the tools.
#   python -m mypy --config-file code/mypy.ini        (run from the repository root)
# mypy is a development tool only; the pipeline itself needs nothing but the standard library.
[mypy]
python_version = 3.12
files = code/audit, code/main.py, code/evaluation, code/tools
mypy_path = code, code/evaluation, code/tools
exclude = custom_cases/suite|evaluation/main\.py
explicit_package_bases = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
warn_return_any = True
warn_unused_ignores = True
warn_redundant_casts = True

# The five unittest files hold hundreds of short unannotated test methods whose class attributes are set in setUpClass. Their
# unannotated bodies are not type-checked (running them is the check); anything in them that is annotated still is.
[mypy-test_llm_layer,test_verifier,test_provenance,test_regression,test_parsers]
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = False
